<!-- Insignia BRUTAL STUDIOS, version para fondo oscuro: circulo negro, letras CALADAS.
     Vector original de la marca, con sus grietas. Se elige al entrar, y esa
     eleccion fija el tema de toda la app.

     El circulo blanco del fondo NO es decorativo: los dos originales vienen con
     relleno negro sobre TRANSPARENTE. En la version negra las letras van caladas,
     asi que sin ese fondo dejarian ver la pantalla —oscura— y el logo se leeria al
     reves. -->
